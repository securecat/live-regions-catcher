<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-msg="sidePanelTitle">Live Regions Catcher</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="panel-header">
    <!-- Chrome already shows the extension name as the side panel title;
         the h1 stays for in-document heading navigation only. -->
    <h1 class="visually-hidden" data-msg="sidePanelTitle">Live Regions Catcher</h1>
    <button type="button" class="panel-button" id="clear-log" data-msg="clearLog">Clear log</button>
  </header>
  <details class="export-panel">
    <summary data-msg="exportSummary">Export</summary>
    <p class="export-privacy" data-msg="exportPrivacyNote">The log may contain personal or sensitive information from the page. Files are saved locally only and are never sent anywhere.</p>
    <form id="export-form">
      <label><input type="checkbox" name="exportIncludeDomPath"> <span data-msg="exportIncludeDomPath">Include DOM paths</span></label>
      <label><input type="checkbox" name="exportIncludeFrameInfo"> <span data-msg="exportIncludeFrameInfo">Include frame info</span></label>
      <label><input type="checkbox" name="exportIncludeNotes"> <span data-msg="exportIncludeNotes">Include notes</span></label>
      <label><input type="checkbox" name="exportIncludePage"> <span data-msg="exportIncludePage">Include page URL and title</span></label>
      <label><input type="checkbox" name="exportIncludeContents"> <span data-msg="exportIncludeContents">Include previous and current content</span></label>
      <label><input type="checkbox" name="exportIncludeExplicitValues"> <span data-msg="exportIncludeExplicitValues">Include explicit ARIA values</span></label>
      <label><input type="checkbox" name="exportIncludeMutations"> <span data-msg="exportIncludeMutations">Include mutation breakdown</span></label>
      <label><input type="checkbox" name="exportIncludeHtml"> <span data-msg="exportIncludeHtml">Include HTML fragments</span></label>
    </form>
    <p class="export-actions" role="group" aria-labelledby="export-actions-label">
      <span id="export-actions-label" data-msg="exportSummary">Export</span>
      <button type="button" class="panel-button" id="export-markdown">Markdown</button>
      <button type="button" class="panel-button" id="export-json">JSON</button>
    </p>
  </details>
  <main class="catch-log">
    <p class="empty-message" id="empty-message" data-msg="sidePanelEmpty">No catches yet. Updates of ARIA live regions on the current tab will appear here.</p>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
